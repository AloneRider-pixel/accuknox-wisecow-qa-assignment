name: Test, build and publish Wisecow
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wisecow-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Unit, Bash and manifest checks
        run: |
          python -m unittest discover -s tests -v
          bash -n wisecow.sh
          python -m pip install 'PyYAML==6.0.2'
          python tools/check_manifests.py
  native-images:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Native build and connection regression
        env:
          ARCH: ${{ matrix.arch }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(docker info --format '{{.Architecture}}')" = "$ARCH" || {
            case "$ARCH:$(docker info --format '{{.Architecture}}')" in amd64:x86_64|arm64:aarch64) ;; *) exit 1;; esac
          }
          docker build -t wisecow:native .
          python3 tools/connection_regression.py wisecow:native
          docker tag wisecow:native "ghcr.io/${REPOSITORY,,}:${GITHUB_SHA}-${ARCH}"
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push exactly the tested native image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          ARCH: ${{ matrix.arch }}
          REPOSITORY: ${{ github.repository }}
        run: docker push "ghcr.io/${REPOSITORY,,}:${GITHUB_SHA}-${ARCH}"
  publish-delivery:
    needs: [checks, native-images]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge native images and create narrow deployment artifact
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${REPOSITORY,,}"
          docker buildx imagetools create -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:latest" "$IMAGE:${GITHUB_SHA}-amd64" "$IMAGE:${GITHUB_SHA}-arm64"
          docker buildx imagetools inspect "$IMAGE:$GITHUB_SHA" --raw > /tmp/image-index.json
          docker buildx imagetools inspect "$IMAGE:$GITHUB_SHA" --format '{{json .Manifest}}' > /tmp/image-descriptor.json
          export IMAGE
          python3 tools/prepare_delivery_artifact.py /tmp/image-index.json /tmp/image-descriptor.json /tmp/wisecow-delivery
          curl --fail --location --retry 2 https://github.com/fluxcd/flux2/releases/download/v2.10.0/flux_2.10.0_linux_amd64.tar.gz -o /tmp/flux.tar.gz
          echo '208dd7012c04fedeed5b2d0b6e63df3b15b1c34a381527811685c098bc9f8659  /tmp/flux.tar.gz' | sha256sum --check
          tar -xzf /tmp/flux.tar.gz -C /tmp flux
          /tmp/flux push artifact "oci://$IMAGE:deploy-$GITHUB_SHA" --path=/tmp/wisecow-delivery --source="https://github.com/$REPOSITORY" --revision="main@sha1:$GITHUB_SHA"
          /tmp/flux tag artifact "oci://$IMAGE:deploy-$GITHUB_SHA" --tag=delivery
          echo 'Published tested multi-platform image and deployment artifact. Local Flux rollout must be verified separately.' >> "$GITHUB_STEP_SUMMARY"
