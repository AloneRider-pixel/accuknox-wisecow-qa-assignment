# Local TLS proxy template. Tested separately with a locally generated strict-validating certificate.
# Requires explicit context/namespace review and private local Secret, not included. Do not whole-directory apply.
apiVersion: v1
kind: ConfigMap
metadata:
  name: wisecow-local-tls-config
  namespace: accuknox-qa
data:
  nginx.conf: "pid /tmp/nginx.pid;\nworker_processes 1;\nerror_log /dev/stderr warn;\n\
    events { worker_connections 128; }\nhttp {\n    access_log /dev/stdout;\n    client_body_temp_path\
    \ /tmp/client_temp;\n    proxy_temp_path /tmp/proxy_temp;\n    fastcgi_temp_path\
    \ /tmp/fastcgi_temp;\n    uwsgi_temp_path /tmp/uwsgi_temp;\n    scgi_temp_path\
    \ /tmp/scgi_temp;\n    client_max_body_size 16k;\n    client_header_timeout 5s;\n\
    \    client_body_timeout 5s;\n    send_timeout 8s;\n    keepalive_timeout 5s;\n\
    \    server {\n        listen 8443 ssl;\n        server_name localhost;\n    \
    \    ssl_certificate /etc/local-tls/tls.crt;\n        ssl_certificate_key /etc/local-tls/tls.key;\n\
    \        ssl_protocols TLSv1.2 TLSv1.3;\n        ssl_session_cache shared:TLS:1m;\n\
    \        ssl_session_timeout 5m;\n        location / {\n            proxy_pass\
    \ http://wisecow:80;\n            proxy_http_version 1.1;\n            proxy_set_header\
    \ Host $host;\n            proxy_set_header Connection close;\n            proxy_connect_timeout\
    \ 3s;\n            proxy_read_timeout 8s;\n            proxy_send_timeout 8s;\n\
    \        }\n    }\n}\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wisecow-local-tls
  namespace: accuknox-qa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wisecow-local-tls
  template:
    metadata:
      labels:
        app: wisecow-local-tls
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
      containers:
      - name: tls-proxy
        image: nginx/nginx-unprivileged@sha256:ea4fd7ab5a8dc6348c18240bd3546f355f8373cd8f112580f7d8bd8ff5a74772
        imagePullPolicy: IfNotPresent
        command:
        - nginx
        args:
        - -g
        - daemon off;
        - -c
        - /etc/nginx/nginx.conf
        ports:
        - name: https
          containerPort: 8443
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 25m
            memory: 16Mi
          limits:
            cpu: 250m
            memory: 64Mi
        startupProbe:
          tcpSocket:
            port: https
          periodSeconds: 2
          failureThreshold: 15
        readinessProbe:
          tcpSocket:
            port: https
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: https
          periodSeconds: 20
          failureThreshold: 3
        volumeMounts:
        - name: config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
          readOnly: true
        - name: tls
          mountPath: /etc/local-tls
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: config
        configMap:
          name: wisecow-local-tls-config
      - name: tls
        secret:
          secretName: wisecow-local-tls
          defaultMode: 288
      - name: tmp
        emptyDir:
          sizeLimit: 8Mi
---
apiVersion: v1
kind: Service
metadata:
  name: wisecow-local-tls
  namespace: accuknox-qa
spec:
  type: ClusterIP
  selector:
    app: wisecow-local-tls
  ports:
  - name: https
    port: 443
    targetPort: https
