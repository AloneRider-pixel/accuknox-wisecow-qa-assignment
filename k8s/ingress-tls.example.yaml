# Optional challenge configuration. Do not apply until an ingress controller,
# a hostname and a certificate secret are deliberately configured.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wisecow
spec:
  ingressClassName: nginx
  tls:
    - hosts: [wisecow.local]
      secretName: wisecow-tls
  rules:
    - host: wisecow.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wisecow
                port:
                  number: 80
